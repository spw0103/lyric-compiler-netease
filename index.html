<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>歌詞寳</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="header">
        <div class="header-icon">♪</div>
        <h1 style="margin:0;">歌曲歌詞編譯器</h1>
        <p style="font-size:13px;opacity:0.7;">資料來源：網易雲音樂</p>
        <p>搜尋歌曲 → 自動提取歌詞 → 生成可點擊目錄的 Word 文件</p>
    </div>

    <div class="container">

        <div class="card">
            <div class="card-header">
                <span>🎤 添加歌曲</span>
            </div>
            <div class="card-body">
                <div class="input-row">
                    <div style="flex:1;">
                        <label for="song-title">歌曲名稱</label>
                        <input type="text" id="song-title" placeholder="例如：告白氣球">
                    </div>
                    <div style="flex:1;">
                        <label for="artist">歌手 <span style="color:#888;font-weight:400;">（選填，留空自動偵測）</span></label>
                        <input type="text" id="artist" placeholder="例如：周杰倫">
                    </div>
                    <div style="display:flex;align-items:flex-end;">
                        <button class="btn btn-primary" onclick="addSong()">➕ 添加</button>
                    </div>
                </div>
                <div id="add-status" style="margin-top:8px;font-size:14px;"></div>

                <div style="margin-top:16px;padding-top:16px;border-top:1px solid #eee;">
                    <span class="lyrics-toggle" onclick="toggleBatch(this)" style="font-size:14px;">▼ 批量輸入多首歌曲</span>
                    <div id="batch-section" style="display:none;margin-top:10px;">
                        <textarea id="batch-input" rows="5" placeholder="每行一首歌，支援格式：&#10;1. 紅日&#10;2. 單車 - 李克勤&#10;3. 小蘋果&#10;泡沫&#10;童話 光良" style="width:100%;padding:12px;background:#f8f9fa;border:1px solid #ddd;border-radius:10px;color:#333;font-size:15px;resize:vertical;outline:none;font-family:inherit;"></textarea>
                        <div class="helper-text">支援格式：<code>歌名</code> <code>1. 歌名</code> <code>歌名 - 歌手</code></div>
                        <button class="btn btn-secondary" onclick="addBatchSongs()" style="margin-top:10px;">📋 批量添加並處理</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="card" id="songs-card" style="display:none;">
            <div class="card-header">
                <span>📋 歌曲列表 (<span id="song-count">0</span>) <span style="color:#888;font-weight:400;font-size:13px;">— 拖拽可調整順序</span></span>
                <button class="btn btn-danger btn-small" onclick="deleteAllSongs()" id="delete-all-btn" style="display:none;">🗑 一鍵刪除</button>
            </div>
            <div class="card-body" id="songs-list"></div>
        </div>

        <div class="card" id="generate-card" style="display:none;">
            <div class="card-body" style="text-align:center;">
                <div style="margin-bottom:16px;display:flex;align-items:center;justify-content:center;gap:10px;">
                    <label for="word-lang" style="color:#555;font-size:15px;">文件字體：</label>
                    <select id="word-lang" style="padding:8px 14px;border:1px solid #ddd;border-radius:8px;font-size:15px;color:#333;background:#fff;outline:none;cursor:pointer;">
                        <option value="zh_tw">繁體</option>
                        <option value="zh_cn">簡體</option>
                    </select>
                </div>
                <button class="btn btn-accent" onclick="generateWord()" style="font-size:18px;padding:16px 48px;">
                    📄 生成 Word 文件
                </button>
                <p style="color:#999;font-size:13px;margin-top:10px;">
                    將生成包含封面、可點擊目錄、歌詞與聆聽鏈接的 Word 文件
                </p>
            </div>
        </div>

        <div id="loading-overlay" style="display:none;">
            <div class="spinner"></div>
            <p>處理中，請稍候...</p>
        </div>

    </div>

    <div class="footer">
        <p>歌曲歌詞編譯器 &copy; 2026 &nbsp;|&nbsp; 資料來源：網易雲音樂</p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/opencc-js@1.0.5/dist/umd/opencc.min.js"></script>
    <script src="app.js?v=5"></script>
</body>
</html>
